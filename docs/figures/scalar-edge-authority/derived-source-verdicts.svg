<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Verdicts for the twenty-six unresolved produced-name rows</title>
  <desc id="desc">Stacked horizontal bars split derived sources, directional or state ambiguities, waveform convention, and state terminology into scalar-intended, edge-intended, and unadjudicated counts.</desc>
  <style>
    .background { fill: rgb(255 255 255); } .title { font: 700 24px sans-serif; fill: rgb(22 34 51); } .subtitle { font: 14px sans-serif; fill: rgb(79 94 112); }
    .label { font: 15px sans-serif; fill: rgb(29 42 58); } .count { font: 14px sans-serif; fill: rgb(29 42 58); } .axis { font: 12px sans-serif; fill: rgb(79 94 112); }
    .grid { stroke: rgb(220 227 235); stroke-width: 1; } .scalar { fill: rgb(60 137 106); } .edge { fill: rgb(208 126 55); } .unknown { fill: rgb(133 98 170); }
  </style>
  <rect class="background" width="1120" height="470"/>
  <text class="title" x="44" y="43">Re-adjudication of the 26 previously unresolved source rows</text>
  <text class="subtitle" x="44" y="67">Provenance settles derived sources; descriptions and units retain unresolved physical conventions without guessing.</text>
  <rect class="scalar" x="725" y="31" width="14" height="14"/><text class="subtitle" x="745" y="43">scalar-intended</text>
  <rect class="edge" x="870" y="31" width="14" height="14"/><text class="subtitle" x="890" y="43">edge-intended</text>
  <rect class="unknown" x="725" y="53" width="14" height="14"/><text class="subtitle" x="745" y="65">unadjudicated</text>
  <line class="grid" x1="370" y1="110" x2="370" y2="350"/><line class="grid" x1="470" y1="110" x2="470" y2="350"/><line class="grid" x1="570" y1="110" x2="570" y2="350"/><line class="grid" x1="670" y1="110" x2="670" y2="350"/><line class="grid" x1="770" y1="110" x2="770" y2="350"/><line class="grid" x1="870" y1="110" x2="870" y2="350"/>
  <text class="axis" x="366" y="100">0</text><text class="axis" x="466" y="100">3</text><text class="axis" x="566" y="100">6</text><text class="axis" x="666" y="100">9</text><text class="axis" x="763" y="100">12</text><text class="axis" x="863" y="100">15</text>
  <text class="label" x="44" y="148">Derived sources</text><rect class="scalar" x="370" y="127" width="33" height="32" rx="4"/><rect class="edge" x="403" y="127" width="467" height="32" rx="4"/><text class="count" x="882" y="149">1 / 14 / 0</text>
  <text class="label" x="44" y="211">Direction or state meaning</text><rect class="unknown" x="370" y="190" width="300" height="32" rx="4"/><text class="count" x="682" y="212">0 / 0 / 9</text>
  <text class="label" x="44" y="274">Waveform convention</text><rect class="unknown" x="370" y="253" width="33" height="32" rx="4"/><text class="count" x="415" y="275">0 / 0 / 1</text>
  <text class="label" x="44" y="337">State terminology on flux</text><rect class="unknown" x="370" y="316" width="33" height="32" rx="4"/><text class="count" x="415" y="338">0 / 0 / 1</text>
  <text class="subtitle" x="44" y="410">Totals: 1 scalar-intended + 14 edge-intended + 11 unadjudicated = 26. Purple rows retain named evidence requirements.</text>
</svg>
